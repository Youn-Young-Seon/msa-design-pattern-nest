syntax = "proto3";

package user;

service UserService {
    rpc CreateUser (CreateUserRequest) returns (CreateUserResponse);
    rpc GetUsers (GetUsersRequest) returns (CreateUserResponse);
    rpc GetUser (GetUserRequest) returns (CreateUserResponse);
}

message CreateUserRequest {
    string email = 1;
    string name = 2;
    string pwd = 3;
    
}

message CreateUserResponse {
    message ResponseOrder {
        string productId = 1;
        int32 qty = 2;
        int32 unitPrice = 3;
        int32 totalPrice = 4;
        string createdAt = 5;
        string orderId = 6;
    }

    string email = 1;
    string name = 2;
    string userId = 3;
    repeated ResponseOrder orders = 4;
}

message GetUsersRequest {}

message GetUserRequest {
    string userId = 1;
}